<h2 mat-dialog-title>Editar jugador</h2>

<mat-dialog-content>

  <div class="error" *ngIf="error">
    <mat-icon>error_outline</mat-icon>
    <p>{{ error }}</p>
  </div>

  <form [formGroup]="jugadorForm" class="editar-form">

    <mat-form-field appearance="outline">
      <mat-label>Nombre</mat-label>
      <input matInput type="text" formControlName="nombre" />

      <mat-error *ngIf="jugadorForm.get('nombre')?.hasError('required')">
        El nombre es obligatorio.
      </mat-error>

      <mat-error *ngIf="jugadorForm.get('nombre')?.hasError('maxlength')">
        El nombre no puede superar los 100 caracteres.
      </mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Nombre completo</mat-label>
      <input matInput type="text" formControlName="nombreCompleto" />

      <mat-error *ngIf="jugadorForm.get('nombreCompleto')?.hasError('maxlength')">
        El nombre no puede superar los 150 caracteres.
      </mat-error>
    </mat-form-field>

    <app-equipos-temporadas-editor
      formControlName="equipos">
    </app-equipos-temporadas-editor>

    <app-pais-autocomplete
      formControlName="paises">
    </app-pais-autocomplete>

    <mat-checkbox formControlName="internacional" class="internacional-check">
      Internacional
    </mat-checkbox>

    <app-anios-editor
      *ngIf="esInternacional"
      formControlName="aniosInternacional">
    </app-anios-editor>

  </form>

</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button type="button" (click)="cancelar()">Cancelar</button>
  <button mat-raised-button color="primary" type="button" (click)="guardar()" [disabled]="cargando">
    <mat-spinner *ngIf="cargando" diameter="18" style="display:inline-block; margin-right:8px"></mat-spinner>
    Guardar
  </button>
</mat-dialog-actions>
