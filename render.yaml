services:
  - type: web
    name: cromoslist
    runtime: docker
    plan: free
    region: oregon
    healthCheckPath: /
    envVars:
      - key: ASPNETCORE_URLS
        value: http://+:${PORT}
      - key: DISABLE_HTTPS_REDIRECT
        value: "true"
      - key: ConnectionStrings__DefaultConnection
        sync: false
      - key: JwtSettings__SecretKey
        sync: false
      - key: TransfermarktScraper__BaseUrl
        fromService:
          type: web
          name: transfermarkt-scraper
          envVarKey: RENDER_EXTERNAL_URL
      - key: TransfermarktScraper__ApiKey
        fromService:
          type: web
          name: transfermarkt-scraper
          envVarKey: TRANSFERMARKT_API_KEY

  - type: web
    name: transfermarkt-scraper
    runtime: docker
    dockerContext: .
    dockerfilePath: ./transfermarkt-deploy/Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: TRANSFERMARKT_API_KEY
        generateValue: true
